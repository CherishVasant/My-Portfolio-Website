<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
    <style>
      body {
        background-color: #fef5ea;
        font-family: sans-serif;
      }

      h1 {
        font-family: serif;
      }

      .calculator {
        background-color: rgb(30, 0, 48);
        padding: 10px;
        width: 400px;
        border-radius: 10px;
      }

      .display {
        background-color: beige;
        border-radius: 10px;
        border-color: black;
        border-style: solid;

        padding: 10px;
        margin: 5px;
        margin-bottom: 10px;
        font-size: 30px;
        text-align: center;
        height: 35px;
      }

      .container {
        display: grid;
        grid-template-columns: auto auto auto auto;
      }

      .container > div {
        border-radius: 10px;
        border-color: black;
        border-style: solid;
        padding: 10px;
        margin: 5px;
        font-size: 25px;
        text-align: center;
      }

      .button {
        background-color: cornflowerblue;
      }

      .operator {
        background-color: rgb(161, 106, 255);
      }

      .important-button {
        background-color: rgb(255, 51, 129);
      }

      .button:hover {
        background-color: rgb(73, 109, 176);
      }
      .operator:hover {
        background-color: rgb(103, 68, 162);
      }
      .important-button:hover {
        background-color: rgb(190, 37, 96);
      }
    </style>
  </head>
  <body>
    <h1>Calculator</h1>

    <div class="calculator">
      <div class="top">
        <div class="display"></div>
      </div>
      <div class="container">
        <div class="important-button">AC</div>
        <div class="important-button">DL</div>
        <div class="operator">%</div>
        <div class="operator">/</div>
        <div class="button">9</div>
        <div class="button">8</div>
        <div class="button">7</div>
        <div class="operator">x</div>
        <div class="button">6</div>
        <div class="button">5</div>
        <div class="button">4</div>
        <div class="operator">-</div>
        <div class="button">3</div>
        <div class="button">2</div>
        <div class="button">1</div>
        <div class="operator">+</div>
        <div class="button">00</div>
        <div class="button">0</div>
        <div class="button">.</div>
        <div class="important-button">=</div>
      </div>
    </div>
  </body>
</html>
